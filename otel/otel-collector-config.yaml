receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: detailed         # imprime TODO lo que llega
  file:
    path: /var/log/otel/aix-telemetry.json

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [debug, file]
    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [debug, file]