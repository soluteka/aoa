apiVersion: v1
kind: ConfigMap
metadata:
  name: aoa-aix-logs-agent-config
  namespace: observability
  labels:
    app.kubernetes.io/name: aoa-aix-logs-agent
    app.kubernetes.io/component: agent
data:
  application.yml: |
    spring:
      profiles:
        active: prod,ssh

    server:
      port: 8081
      shutdown: graceful

    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          probes:
            enabled: true
          show-details: never

    otel:
      exporter:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
          timeout: 10000

    aix:
      scheduler:
        interval-seconds: 10
      syslog:
        udp-port: 5140
        tcp-port: 5141
      alerts:
        paging-used-warn-pct: 70
        paging-used-critical-pct: 85
        paging-rate-warn: 5
        paging-rate-critical: 10
      ssh:
        user: ${AIX_SSH_USER}
        private-key-path: /etc/aoa/keys/id_rsa
        skip-host-key-verification: false
        known-hosts-path: /etc/aoa/keys/known_hosts
        connect-timeout-ms: 10000
        command-timeout-ms: 15000
      lpars:
        - name: lpar-prod-01
          host: 10.10.20.11
          port: 22
          environment: prod
        - name: lpar-prod-02
          host: 10.10.20.12
          port: 22
          environment: prod
        # 👆 Lista real de LPARs la define infra/operación

    logging:
      level:
        root: INFO
        com.aoa.aix: INFO
        net.schmizz.sshj: WARN