# ============================================================
# PLANTILLA — NO COMMITEAR VALORES REALES
# ============================================================
# Crear el Secret real con:
#   kubectl -n observability create secret generic aoa-aix-logs-agent-ssh \
#     --from-file=id_rsa=/ruta/local/id_rsa \
#     --from-file=known_hosts=/ruta/local/known_hosts \
#     --from-literal=ssh-user=aoa_reader
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: aoa-aix-logs-agent-ssh
  namespace: observability
  labels:
    app.kubernetes.io/name: aoa-aix-logs-agent
type: Opaque
stringData:
  ssh-user: "aoa_reader"
  id_rsa: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...REEMPLAZAR EN ENTORNO REAL...
    -----END OPENSSH PRIVATE KEY-----
  known_hosts: |
    10.10.20.11 ssh-ed25519 AAAA...
    10.10.20.12 ssh-ed25519 AAAA...