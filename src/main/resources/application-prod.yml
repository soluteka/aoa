spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      timeout: 10000
  resource:
    attributes:
      service.name: aoa-aix-logs-agent
      service.version: @project.version@
      deployment.environment: ${DEPLOYMENT_ENV:prod}
      aix.agent.version: @project.version@

aix:
  scheduler:
    interval-seconds: ${AIX_SCHEDULER_INTERVAL:10}
  syslog:
    udp-port: ${AIX_SYSLOG_UDP_PORT:5140}
    tcp-port: ${AIX_SYSLOG_TCP_PORT:5141}
  alerts:
    paging-used-warn-pct: 70
    paging-used-critical-pct: 85
    paging-rate-warn: 5
    paging-rate-critical: 10
  ssh:
    user: ${AIX_SSH_USER}
    private-key-path: ${AIX_SSH_KEY_PATH:/etc/aoa/keys/id_rsa}
    skip-host-key-verification: false
    known-hosts-path: ${AIX_SSH_KNOWN_HOSTS:/etc/aoa/keys/known_hosts}
    connect-timeout-ms: 10000
    command-timeout-ms: 15000
  # ⚠️ La lista real de LPARs se inyecta vía ConfigMap externo o
  # archivo montado en /app/config/application.yml (no se versiona aquí).
  lpars: []

logging:
  level:
    root: INFO
    com.aoa.aix: INFO
    net.schmizz.sshj: WARN
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","thread":"%thread","msg":"%message"}%n'